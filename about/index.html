      <h1 class="page-title">关于影迹</h1>
      <p class="page-lead">作者：呆胶布。这是一个打开就能用的观影记录网页。</p>
      <h2>怎么用</h2>
      <ul>
        <li>在首页写下片名、想看 / 在看 / 看完、评分、标签和笔记。</li>
        <li>记录保存在这台浏览器里，刷新还在。可以导出 JSON，再导入回来。</li>
        <li>偏好栏写下喜欢或不想看的标签。首页的「本地偏好推荐」只按这些文字在自带片单里打分。</li>
      </ul>
      <p>推荐不是模型调用，也没有外部片库。自带片单是本站写好的示例片名。</p>
